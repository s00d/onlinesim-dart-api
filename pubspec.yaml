name: onlinesim
description: >-
  Typed Dart client for the OnlineSim SMS API: numbers, rent, account, free
  numbers and webhooks, with a built-in offline mock for tests. Flutter and web.
version: 1.0.1
homepage: https://s00d.github.io/onlinesim-dart-api/
repository: https://github.com/s00d/onlinesim-dart-api
issue_tracker: https://github.com/s00d/onlinesim-dart-api/issues
documentation: https://s00d.github.io/onlinesim-dart-api/
topics:
  - sms
  - api
  - onlinesim
  - otp

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: '>=1.0.0 <2.0.0'

dev_dependencies:
  fake_async: ^1.3.1
  lints: '>=3.0.0 <7.0.0'
  test: ^1.24.0
